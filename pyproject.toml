[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Text-to-SQL Agent with FastAPI and Streamlit UI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=2.16.0",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.1",
    "markdown>=3.10.3",
    "openai>=2.51.0",
    "pandas>=3.0.5",
    "prettytable>=3.18.0",
    "psycopg2-binary>=2.9.12",
    "pymssql>=2.3.13",
    "pymysql>=1.2.0",
    "pyodbc>=5.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.51",
    "sqlglot>=30.14.0",
    "streamlit>=1.60.0",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
